name: Keep Render Services Alive

on:
  schedule:
    - cron: "*/5 * * * *"  # Runs every 5 minutes

jobs:
  ping_services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          RESPONSE=$(curl -o /dev/null -s -w "%{http_code}" https://ionianems-backend.onrender.com/)
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Backend might be down! Status code: $RESPONSE"
            exit 1
          fi
          echo "Backend is alive! ✅"

      - name: Ping Render Frontend
        run: |
          RESPONSE=$(curl -o /dev/null -s -w "%{http_code}" https://ionianems-frontend.onrender.com/)
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Frontend might be down! Status code: $RESPONSE"
            exit 1
          fi
          echo "Frontend is alive! ✅"
