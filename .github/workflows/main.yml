name: Keep Render Services Alive

on:
  schedule:
    - cron: "*/15 * * * *"  # Runs every 15 minutes
  workflow_dispatch:

jobs:
  ping_services:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Confirm workflow is running
        run: echo "Workflow triggered successfully!"

      - name: 🔍 Ping Render Backend with Retry
        run: |
          URL="https://ionianems-backend.onrender.com/api/contact"
          for i in {1..5}; do
            RESPONSE=$(curl -A "Mozilla/5.0" -o /dev/null -s -w "%{http_code}" "$URL")
            echo "Attempt $i - Backend Response: $RESPONSE"
            if [ "$RESPONSE" -eq 200 ]; then
              echo "✅ Backend is alive!"
              break
            elif [ "$RESPONSE" -eq 429 ]; then
              echo "⚠️ Backend rate-limited. Waiting 20 seconds..."
              sleep 20
            else
              echo "❌ Unexpected backend error: $RESPONSE"
              exit 1
            fi
          done
